[package]
name = "papago-tts-downloader"
version = "0.3.0"
description = "파파고 TTS 음성을 mp3로 저장하는 교육용 비공식 프로그램"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2"] }

# 실행 파일을 작게 만드는 설정
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
